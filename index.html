<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naomi's English Funland presents: Winnie the Pooh's Word Adventure</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #FFFbeb; 
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; 
            color: #78350f;
            background-image: radial-gradient(#fde68a 2px, transparent 2px);
            background-size: 30px 30px;
            touch-action: manipulation;
        }
        .grid-container {
            display: grid;
            gap: 2px;
            background-color: #fbbf24;
            padding: 4px;
            border-radius: 8px;
            border: 4px solid #b45309;
            width: fit-content;
            margin: 0 auto;
            touch-action: none;
        }
        .grid-cell { 
            width: clamp(22px, 2.6vw, 32px); 
            height: clamp(22px, 2.6vw, 32px); 
            background-color: white;
            text-transform: uppercase; 
            user-select: none; 
            -webkit-user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: clamp(0.75rem, 1.2vw, 1.2rem);
            cursor: pointer;
            border-radius: 3px;
            color: #78350f;
            transition: background-color 0.1s;
        }
        .grid-cell.selected { background-color: #93c5fd; color: #1e3a8a; } 
        .grid-cell.found { background-color: #4ade80; color: #14532d; }    
        .grid-cell.tap-start { background-color: #fef08a; border: 2px solid #eab308; }

        .pooh-btn { 
            background-color: #fbbf24; 
            border: 3px solid #b45309; 
            border-radius: 9999px; 
            font-weight: bold; 
            color: #78350f; 
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .pooh-btn:hover { 
            transform: translateY(-2px);
            background-color: #f59e0b;
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }
        .pooh-btn:active {
            transform: translateY(1px);
        }
        .pooh-btn:disabled {
            background-color: #d1d5db;
            border-color: #9ca3af;
            color: #6b7280;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const WORD_DICTIONARY = {
            "ambitious": "Having or showing a strong desire and determination to succeed.",
            "aspiring": "Directing one's hopes or ambitions towards becoming a specified type of person.",
            "avid": "Having or showing a keen interest in or enthusiasm for something.",
            "creativity": "The use of imagination or original ideas to create something.",
            "dependent": "Contingent on or determined by someone or something else.",
            "diligent": "Having or showing care and conscientiousness in one's work or duties.",
            "keep your nose to the grindstone": "To work hard and continuously without stopping.",
            "optimistic": "Hopeful and confident about the future.",
            "spirit": "The non-physical part of a person which is the seat of emotions and character.",
            "stressful": "Causing mental or emotional stress.",
            "well-behaved": "Conducting oneself in an appropriate and polite manner.",
            "addiction": "The fact or condition of being addicted to a particular substance or activity.",
            "breaking point": "The moment of greatest strain at which someone or something gives way.",
            "bottle neck": "A point of congestion or blockage.",
            "concerned": "Worried, troubled, or anxious.",
            "disrupt": "Interrupt an event, activity, or process by causing a disturbance or problem.",
            "doubt": "A feeling of uncertainty or lack of conviction.",
            "embarrassed": "Feeling or showing embarrassment, shame, or awkwardness.",
            "failure": "Lack of success.",
            "fruitful": "Producing good or helpful results; productive.",
            "fulfilling": "Making someone satisfied or happy through developing their abilities.",
            "furious": "Extremely angry.",
            "gratifying": "Giving pleasure or satisfaction.",
            "gruelling": "Extremely tiring and demanding.",
            "guilty": "Culpable of or responsible for a specified wrongdoing.",
            "happiness": "The state of being happy and joyful."
        };
        const WORD_LIST = Object.keys(WORD_DICTIONARY);

        const generateGrid = (size, words) => {
            let grid = Array(size).fill(null).map(() => Array(size).fill(''));
            let placedWords = [];
            
            words.forEach(word => {
                const cleanWord = word.replace(/[^a-zA-Z]/g, '').toUpperCase();
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 200) {
                    const isHorizontal = Math.random() > 0.5;
                    const row = Math.floor(Math.random() * (isHorizontal ? size : size - cleanWord.length));
                    const col = Math.floor(Math.random() * (isHorizontal ? size - cleanWord.length : size));
                    
                    let canPlace = true;
                    for (let i = 0; i < cleanWord.length; i++) {
                        const r = isHorizontal ? row : row + i;
                        const c = isHorizontal ? col + i : col;
                        if (grid[r][c] !== '' && grid[r][c] !== cleanWord[i]) {
                            canPlace = false;
                            break;
                        }
                    }
                    if (canPlace) {
                        const coordinates = [];
                        for (let i = 0; i < cleanWord.length; i++) {
                            const r = isHorizontal ? row : row + i;
                            const c = isHorizontal ? col + i : col;
                            grid[r][c] = cleanWord[i];
                            coordinates.push(`${r}-${c}`);
                        }
                        placedWords.push({ word, cleanWord, coordinates });
                        placed = true;
                    }
                    attempts++;
                }
            });

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c] === '') {
                        grid[r][c] = String.fromCharCode(65 + Math.floor(Math.random() * 26));
                    }
                }
            }
            return { grid, placedWords };
        };

        const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}m ${s}s`;
        };

        const App = () => {
            const [view, setView] = useState('game'); 
            const [nickname, setNickname] = useState('');
            const [hasStarted, setHasStarted] = useState(false);
            
            const [gridData, setGridData] = useState({ grid: [], placedWords: [] });
            const [foundWords, setFoundWords] = useState([]);
            const [foundCoordinates, setFoundCoordinates] = useState(new Set());
            const [timeElapsed, setTimeElapsed] = useState(0);
            
            // Selection & Touch State
            const [isSelecting, setIsSelecting] = useState(false);
            const [selectionStart, setSelectionStart] = useState(null);
            const [currentSelection, setCurrentSelection] = useState([]);
            const [tapStartCell, setTapStartCell] = useState(null);

            const [story, setStory] = useState('');
            const [grammarFeedback, setGrammarFeedback] = useState('');
            const [grammarScore, setGrammarScore] = useState(null);
            const [hasSubmitted, setHasSubmitted] = useState(false);

            useEffect(() => {
                setGridData(generateGrid(30, WORD_LIST));
            }, []);

            useEffect(() => {
                let timer;
                if (hasStarted && foundWords.length < WORD_LIST.length) {
                    timer = setInterval(() => {
                        setTimeElapsed(prev => prev + 1);
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [hasStarted, foundWords.length]);

            useEffect(() => {
                const handleGlobalUp = () => {
                    if (isSelecting) finalizeSelection();
                };
                window.addEventListener('mouseup', handleGlobalUp);
                window.addEventListener('touchend', handleGlobalUp);
                return () => {
                    window.removeEventListener('mouseup', handleGlobalUp);
                    window.removeEventListener('touchend', handleGlobalUp);
                };
            }, [isSelecting, currentSelection, gridData, foundWords, foundCoordinates]);

            const speakWord = (text) => {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    window.speechSynthesis.speak(utterance);
                }
            };

            const getLineCoords = (start, end) => {
                const coords = [];
                const dr = Math.sign(end.r - start.r);
                const dc = Math.sign(end.c - start.c);
                const steps = Math.max(Math.abs(end.r - start.r), Math.abs(end.c - start.c));
                
                if (dr !== 0 && dc !== 0 && Math.abs(end.r - start.r) !== Math.abs(end.c - start.c)) {
                    return [ `${start.r}-${start.c}` ]; 
                }

                for (let i = 0; i <= steps; i++) {
                    coords.push(`${start.r + i * dr}-${start.c + i * dc}`);
                }
                return coords;
            };

            const checkSelectionMatch = (coords) => {
                const selectionStr = coords.join('|');
                const reverseSelectionStr = [...coords].reverse().join('|');

                const matchedWord = gridData.placedWords.find(pw => {
                    const wordPathStr = pw.coordinates.join('|');
                    return (wordPathStr === selectionStr || wordPathStr === reverseSelectionStr) && !foundWords.includes(pw.word);
                });

                if (matchedWord) {
                    setFoundWords(prev => [...prev, matchedWord.word]);
                    setFoundCoordinates(prev => {
                        const next = new Set(prev);
                        matchedWord.coordinates.forEach(c => next.add(c));
                        return next;
                    });
                    speakWord(matchedWord.word);
                    return true;
                }
                return false;
            };

            const handleMouseDown = (r, c) => {
                setTapStartCell(null);
                setIsSelecting(true);
                setSelectionStart({ r, c });
                setCurrentSelection([`${r}-${c}`]);
            };

            const handleMouseEnter = (r, c) => {
                if (isSelecting && selectionStart) {
                    setCurrentSelection(getLineCoords(selectionStart, { r, c }));
                }
            };

            const handleTouchStart = (e, r, c) => {
                setTapStartCell(null);
                setIsSelecting(true);
                setSelectionStart({ r, c });
                setCurrentSelection([`${r}-${c}`]);
            };

            const handleTouchMove = (e) => {
                if (!isSelecting || !selectionStart) return;
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (target && target.dataset && target.dataset.r !== undefined) {
                    const r = parseInt(target.dataset.r, 10);
                    const c = parseInt(target.dataset.c, 10);
                    setCurrentSelection(getLineCoords(selectionStart, { r, c }));
                }
            };

            const finalizeSelection = () => {
                if (currentSelection.length > 0) {
                    checkSelectionMatch(currentSelection);
                }
                setIsSelecting(false);
                setCurrentSelection([]);
            };

            // Mobile Tap-to-Select Fallback (Tap start letter, tap end letter)
            const handleCellClick = (r, c) => {
                if (isSelecting) return;
                
                if (!tapStartCell) {
                    setTapStartCell({ r, c });
                } else {
                    if (tapStartCell.r === r && tapStartCell.c === c) {
                        setTapStartCell(null);
                    } else {
                        const line = getLineCoords(tapStartCell, { r, c });
                        checkSelectionMatch(line);
                        setTapStartCell(null);
                    }
                }
            };

            const checkGrammar = () => {
                let errors = [];
                const cleanStory = story.toLowerCase().replace(/[.,!?]/g, '');
                const usedWords = WORD_LIST.filter(w => {
                    const cleanW = w.toLowerCase().replace(/[.,!?]/g, '');
                    return cleanStory.includes(cleanW);
                });
                
                if (usedWords.length < 8) {
                    errors.push(`You have only used ${usedWords.length}/8 required words.`);
                }
                if (story.length > 0 && story[0] !== story[0].toUpperCase()) {
                    errors.push("Sentence must start with a capital letter.");
                }
                if (!story.endsWith('.') && !story.endsWith('!') && !story.endsWith('?')) {
                    errors.push("Missing punctuation at the end of the paragraph.");
                }

                const score = Math.max(0, 100 - (errors.length * 10));
                setGrammarScore(score);
                setHasSubmitted(false); 
                
                if (errors.length > 0) {
                    setGrammarFeedback("Needs improvement: " + errors.join(" "));
                } else {
                    setGrammarFeedback("Perfect! 100% Grammatical Accuracy.");
                }
            };

            const submitScore = () => {
                if (grammarScore === null) return;
                const logs = JSON.parse(localStorage.getItem('pooh_logs') || '[]');
                logs.push({ 
                    nickname, 
                    score: grammarScore, 
                    searchTime: timeElapsed,
                    time: new Date().toLocaleTimeString() 
                });
                localStorage.setItem('pooh_logs', JSON.stringify(logs));
                setHasSubmitted(true);
                alert("Score successfully submitted to the Hall of Fame!");
            };

            const TeacherDashboard = () => {
                const [pwd, setPwd] = useState('');
                const [auth, setAuth] = useState(false);
                const logs = JSON.parse(localStorage.getItem('pooh_logs') || '[]');

                if (!auth) return (
                    <div className="p-6 md:p-10 text-center bg-white max-w-md mx-auto mt-10 rounded-2xl shadow-lg border-4 border-orange-300">
                        <h2 className="text-2xl mb-4 text-red-600 font-bold">👩‍🏫 Teacher Login</h2>
                        <input type="password" value={pwd} onChange={e => setPwd(e.target.value)} className="border-2 border-orange-200 p-2 rounded mb-4 w-full" placeholder="Enter Password" />
                        <button onClick={() => pwd === '123' ? setAuth(true) : alert('Wrong password')} className="pooh-btn w-full py-2">Login</button>
                    </div>
                );

                return (
                    <div className="p-4 md:p-10 bg-white rounded-2xl shadow-lg mt-6 border-4 border-orange-300">
                        <div className="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                            <h2 className="text-2xl font-bold text-red-600">Teacher Dashboard</h2>
                            <button onClick={() => alert("Downloading CSV...")} className="bg-green-500 text-white font-bold px-4 py-2 rounded-full hover:bg-green-600 w-full sm:w-auto">📥 Download CSV</button>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[500px]">
                                <thead>
                                    <tr className="bg-orange-200 text-orange-900">
                                        <th className="p-3 border-2 border-orange-300">Student Name</th>
                                        <th className="p-3 border-2 border-orange-300">Search Time</th>
                                        <th className="p-3 border-2 border-orange-300">Grammar Score</th>
                                        <th className="p-3 border-2 border-orange-300">Submission Time</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {logs.length === 0 ? <tr><td colSpan="4" className="p-4 text-center">No submissions yet!</td></tr> : 
                                    logs.map((log, i) => (
                                        <tr key={i} className="hover:bg-orange-50">
                                            <td className="p-3 border-2 border-orange-200">{log.nickname}</td>
                                            <td className="p-3 border-2 border-orange-200">{formatTime(log.searchTime || 0)}</td>
                                            <td className="p-3 border-2 border-orange-200">{log.score}%</td>
                                            <td className="p-3 border-2 border-orange-200">{log.time}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            if (!hasStarted) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4">
                        <div className="bg-white p-6 sm:p-12 rounded-3xl shadow-2xl border-8 border-orange-300 max-w-2xl text-center relative overflow-hidden w-full">
                            <div className="text-5xl sm:text-6xl mb-4">🐻🍯🐝</div>
                            <h1 className="text-2xl sm:text-4xl md:text-5xl font-bold mb-4 text-red-600 leading-tight">
                                Naomi's English Funland presents:<br/>
                                <span className="text-orange-500">Winnie the Pooh's Word Adventure</span>
                            </h1>
                            <p className="mb-8 text-base sm:text-xl text-orange-800">Find the hidden words and write a perfect story!</p>
                            
                            <div className="space-y-6 max-w-sm mx-auto">
                                <input 
                                    type="text" 
                                    placeholder="Enter your nickname" 
                                    className="w-full p-3 sm:p-4 text-lg sm:text-xl border-4 border-yellow-400 rounded-xl text-center focus:outline-none focus:border-red-400" 
                                    value={nickname} 
                                    onChange={e => setNickname(e.target.value)} 
                                    onKeyDown={e => e.key === 'Enter' && nickname && setHasStarted(true)}
                                />
                                <button 
                                    onClick={() => nickname ? setHasStarted(true) : alert('Please enter a nickname to begin your adventure!')} 
                                    className="pooh-btn w-full py-3 sm:py-4 text-xl sm:text-2xl"
                                >
                                    Start Game!
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-2 sm:p-4 max-w-7xl mx-auto">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-4 sm:mb-6 bg-white p-4 rounded-2xl shadow-md border-4 border-orange-300 gap-4">
                        <div className="flex items-center gap-3">
                            <span className="text-3xl">🐻</span>
                            <h1 className="text-lg sm:text-xl md:text-2xl font-bold text-red-600 text-center sm:text-left">Winnie the Pooh's Word Adventure</h1>
                        </div>
                        <div className="flex flex-wrap gap-2 justify-center w-full md:w-auto">
                            <button onClick={() => setView('game')} className={`pooh-btn px-3 py-1.5 sm:px-4 sm:py-2 text-sm sm:text-base ${view === 'game' ? 'bg-orange-400' : ''}`}>🍯 Game</button>
                            <button onClick={() => setView('hall')} className={`pooh-btn px-3 py-1.5 sm:px-4 sm:py-2 text-sm sm:text-base ${view === 'hall' ? 'bg-orange-400' : ''}`}>🏆 Hall of Fame</button>
                            <button onClick={() => setView('teacher')} className={`pooh-btn px-3 py-1.5 sm:px-4 sm:py-2 text-sm sm:text-base ${view === 'teacher' ? 'bg-orange-400' : ''}`}>👩‍🏫 Teacher</button>
                        </div>
                    </div>

                    <div style={{ display: view === 'game' ? 'block' : 'none' }}>
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            
                            <div className="lg:col-span-2 bg-white p-3 sm:p-6 rounded-3xl shadow-lg border-4 border-yellow-400 overflow-x-auto">
                                <h2 className="text-xl sm:text-3xl font-bold mb-2 text-center text-orange-700">🐝 Hundred Acre Wood Word Hunt</h2>
                                <p className="text-center mb-4 text-xs sm:text-sm text-orange-600">Drag across letters OR tap first and last letter!</p>
                                
                                <div className="overflow-x-auto pb-2">
                                    <div 
                                        className="grid-container" 
                                        style={{ gridTemplateColumns: `repeat(30, 1fr)` }}
                                        onTouchMove={handleTouchMove}
                                    >
                                        {gridData.grid.map((row, rIdx) => 
                                            row.map((cell, cIdx) => {
                                                const coord = `${rIdx}-${cIdx}`;
                                                const isFound = foundCoordinates.has(coord);
                                                const isSelected = currentSelection.includes(coord);
                                                const isTapStart = tapStartCell && tapStartCell.r === rIdx && tapStartCell.c === cIdx;
                                                
                                                let className = "grid-cell";
                                                if (isFound) className += " found";
                                                else if (isSelected) className += " selected";
                                                else if (isTapStart) className += " tap-start";

                                                return (
                                                    <div 
                                                        key={coord} 
                                                        data-r={rIdx}
                                                        data-c={cIdx}
                                                        className={className}
                                                        onMouseDown={(e) => { e.preventDefault(); handleMouseDown(rIdx, cIdx); }}
                                                        onMouseEnter={() => handleMouseEnter(rIdx, cIdx)}
                                                        onTouchStart={(e) => handleTouchStart(e, rIdx, cIdx)}
                                                        onClick={() => handleCellClick(rIdx, cIdx)}
                                                    >
                                                        {cell}
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div className="bg-white p-4 sm:p-6 rounded-3xl shadow-lg border-4 border-orange-300">
                                    <h2 className="text-xl sm:text-2xl font-bold mb-2 text-orange-800">🦉 Owl's Wisdom</h2>
                                    <div className="flex justify-between items-center mb-4">
                                        <p className="text-xs sm:text-sm text-gray-600">Words found: {foundWords.length} / {WORD_LIST.length}</p>
                                        <p className="text-xs sm:text-sm font-bold text-orange-600">⏱️ {formatTime(timeElapsed)}</p>
                                    </div>
                                    
                                    <div className="flex flex-wrap gap-1.5 sm:gap-2 max-h-40 sm:max-h-48 overflow-y-auto p-2 mb-4 border-b-2 border-orange-100 pb-4">
                                        {WORD_LIST.map(word => (
                                            <span 
                                                key={word} 
                                                className={`px-2 py-0.5 sm:px-3 sm:py-1 text-xs sm:text-sm rounded-full font-bold border-2 ${foundWords.includes(word) ? 'bg-green-200 border-green-500 text-green-900 line-through' : 'bg-yellow-100 border-yellow-300 text-yellow-800'}`}
                                            >
                                                {word}
                                            </span>
                                        ))}
                                    </div>
                                    
                                    <div className="max-h-52 sm:max-h-64 overflow-y-auto pr-2 space-y-3">
                                        <h3 className="font-bold text-orange-700 text-sm sm:text-base mb-2">Discovered Meanings:</h3>
                                        {foundWords.length === 0 && <p className="text-gray-500 text-xs sm:text-sm italic">Find words to reveal their meanings!</p>}
                                        {foundWords.map(word => (
                                            <div key={word} className="bg-green-50 border-l-4 border-green-500 p-2 rounded-r">
                                                <strong className="text-green-900 block capitalize text-xs sm:text-sm">{word}</strong>
                                                <span className="text-xs sm:text-sm text-green-800">{WORD_DICTIONARY[word]}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-white p-4 sm:p-6 rounded-3xl shadow-lg border-4 border-orange-300">
                                    <h2 className="text-xl sm:text-2xl font-bold mb-2 text-orange-800">👦 Christopher Robin's Challenge</h2>
                                    <p className="text-xs sm:text-sm mb-4 text-gray-700">Write a story using at least <strong>8 vocabulary words</strong>.</p>
                                    <textarea 
                                        value={story} 
                                        onChange={e => setStory(e.target.value)} 
                                        className="w-full h-32 sm:h-40 p-3 sm:p-4 text-sm sm:text-base border-2 border-orange-200 rounded-xl mb-4 focus:outline-none focus:border-orange-500 resize-none" 
                                        placeholder="Once upon a time in the Hundred Acre Wood..."
                                    ></textarea>
                                    
                                    <div className="flex flex-col sm:flex-row gap-2">
                                        <button onClick={checkGrammar} className="pooh-btn flex-1 py-2.5 sm:py-3 text-base sm:text-lg">Check Story!</button>
                                        
                                        {grammarScore !== null && (
                                            <button 
                                                onClick={submitScore} 
                                                disabled={hasSubmitted}
                                                className="pooh-btn flex-1 py-2.5 sm:py-3 text-base sm:text-lg bg-green-400 border-green-600 hover:bg-green-500"
                                            >
                                                {hasSubmitted ? 'Submitted!' : 'Submit Score'}
                                            </button>
                                        )}
                                    </div>
                                    
                                    {grammarScore !== null && (
                                        <div className={`mt-4 p-3 sm:p-4 rounded-xl border-2 ${grammarScore === 100 ? 'bg-green-100 border-green-400 text-green-800' : 'bg-red-100 border-red-400 text-red-800'}`}>
                                            <p className="font-bold text-base sm:text-lg mb-1">Score: {grammarScore}%</p>
                                            <p className="text-xs sm:text-sm">{grammarFeedback}</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div style={{ display: view === 'hall' ? 'block' : 'none' }}>
                        <div className="bg-white p-6 sm:p-10 rounded-3xl shadow-lg text-center max-w-3xl mx-auto border-4 border-yellow-400 mt-6">
                            <h2 className="text-3xl sm:text-5xl font-bold mb-4 sm:mb-8 text-yellow-600">🏆 Global Hall of Fame</h2>
                            <p className="mb-6 sm:mb-8 text-lg sm:text-xl text-orange-800">Current Explorer: <span className="font-bold text-red-600">{nickname}</span></p>
                            
                            <div className="bg-yellow-50 p-4 sm:p-6 rounded-2xl border-2 border-orange-200">
                                {JSON.parse(localStorage.getItem('pooh_logs') || '[]').length === 0 ? (
                                    <p className="text-gray-500 italic text-sm sm:text-base">No scores submitted yet. Be the first!</p>
                                ) : (
                                    <div className="space-y-3">
                                        {JSON.parse(localStorage.getItem('pooh_logs') || '[]')
                                            .sort((a, b) => b.score - a.score || a.searchTime - b.searchTime)
                                            .map((log, i) => (
                                            <div key={i} className="flex justify-between items-center bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-orange-100 flex-wrap gap-2">
                                                <span className="font-bold text-base sm:text-lg text-orange-900">#{i + 1} {log.nickname}</span>
                                                <div className="flex gap-2">
                                                    <span className="bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full font-bold text-xs sm:text-sm">⏱️ {formatTime(log.searchTime || 0)}</span>
                                                    <span className="bg-green-100 text-green-800 px-2.5 py-1 rounded-full font-bold text-xs sm:text-sm">{log.score}% Accuracy</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div style={{ display: view === 'teacher' ? 'block' : 'none' }}>
                        <TeacherDashboard />
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
