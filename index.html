<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naomi's English Funland presents: Winnie the Pooh's Word Adventure</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #FFFbeb; 
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; 
            color: #78350f;
            background-image: radial-gradient(#fde68a 2px, transparent 2px);
            background-size: 30px 30px;
        }
        .grid-container {
            display: grid;
            gap: 2px;
            background-color: #fbbf24;
            padding: 4px;
            border-radius: 8px;
            border: 4px solid #b45309;
            width: fit-content;
            margin: 0 auto;
        }
        .grid-cell { 
            width: 32px; 
            height: 32px; 
            background-color: white;
            text-transform: uppercase; 
            user-select: none; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 4px;
            color: #78350f;
        }
        .grid-cell.selected { background-color: #93c5fd; color: #1e3a8a; } 
        .grid-cell.found { background-color: #fde047; color: #854d0e; }    
        
        .pooh-btn { 
            background-color: #fbbf24; 
            border: 3px solid #b45309; 
            border-radius: 9999px; 
            font-weight: bold; 
            color: #78350f; 
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .pooh-btn:hover { 
            transform: translateY(-2px);
            background-color: #f59e0b;
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }
        .pooh-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const WORD_LIST = [
            "ambitious", "aspiring", "avid", "creativity", "dependent", "diligent", 
            "keep your nose to the grindstone", "optimistic", "spirit", "stressful", 
            "well-behaved", "addiction", "breaking point", "bottle neck", "concerned", 
            "disrupt", "doubt", "embarrassed", "failure", "fruitful", "fulfilling", 
            "furious", "gratifying", "gruelling", "guilty", "happiness"
        ];

        // Grid Generation
        const generateGrid = (size, words) => {
            let grid = Array(size).fill(null).map(() => Array(size).fill(''));
            let placedWords = [];
            
            words.forEach(word => {
                const cleanWord = word.replace(/[^a-zA-Z]/g, '').toUpperCase();
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 200) {
                    const isHorizontal = Math.random() > 0.5;
                    const row = Math.floor(Math.random() * (isHorizontal ? size : size - cleanWord.length));
                    const col = Math.floor(Math.random() * (isHorizontal ? size - cleanWord.length : size));
                    
                    let canPlace = true;
                    for (let i = 0; i < cleanWord.length; i++) {
                        const r = isHorizontal ? row : row + i;
                        const c = isHorizontal ? col + i : col;
                        if (grid[r][c] !== '' && grid[r][c] !== cleanWord[i]) {
                            canPlace = false;
                            break;
                        }
                    }
                    if (canPlace) {
                        const coordinates = [];
                        for (let i = 0; i < cleanWord.length; i++) {
                            const r = isHorizontal ? row : row + i;
                            const c = isHorizontal ? col + i : col;
                            grid[r][c] = cleanWord[i];
                            coordinates.push(`${r}-${c}`);
                        }
                        placedWords.push({ word, cleanWord, coordinates });
                        placed = true;
                    }
                    attempts++;
                }
            });

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c] === '') {
                        grid[r][c] = String.fromCharCode(65 + Math.floor(Math.random() * 26));
                    }
                }
            }
            return { grid, placedWords };
        };

        const App = () => {
            const [view, setView] = useState('game'); 
            const [nickname, setNickname] = useState('');
            const [hasStarted, setHasStarted] = useState(false);
            
            // Game State
            const [gridData, setGridData] = useState({ grid: [], placedWords: [] });
            const [foundWords, setFoundWords] = useState([]);
            const [foundCoordinates, setFoundCoordinates] = useState(new Set());
            
            // Selection State
            const [isSelecting, setIsSelecting] = useState(false);
            const [selectionStart, setSelectionStart] = useState(null);
            const [currentSelection, setCurrentSelection] = useState([]);

            // Writing Challenge State
            const [story, setStory] = useState('');
            const [grammarFeedback, setGrammarFeedback] = useState('');
            const [grammarScore, setGrammarScore] = useState(null);

            // FIX: Grid generation separated so it only ever runs ONCE on load
            useEffect(() => {
                setGridData(generateGrid(30, WORD_LIST));
            }, []);

            // FIX: Global mouse events handled independently
            useEffect(() => {
                const handleGlobalMouseUp = () => {
                    if (isSelecting) handleMouseUp();
                };
                window.addEventListener('mouseup', handleGlobalMouseUp);
                return () => window.removeEventListener('mouseup', handleGlobalMouseUp);
            }, [isSelecting, currentSelection, gridData, foundWords, foundCoordinates]);

            const speakWord = (text) => {
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            };

            // Grid Interaction Logic
            const getLineCoords = (start, end) => {
                const coords = [];
                const dr = Math.sign(end.r - start.r);
                const dc = Math.sign(end.c - start.c);
                const steps = Math.max(Math.abs(end.r - start.r), Math.abs(end.c - start.c));
                
                if (dr !== 0 && dc !== 0 && Math.abs(end.r - start.r) !== Math.abs(end.c - start.c)) {
                    return [ `${start.r}-${start.c}` ]; 
                }

                for (let i = 0; i <= steps; i++) {
                    coords.push(`${start.r + i * dr}-${start.c + i * dc}`);
                }
                return coords;
            };

            const handleMouseDown = (r, c) => {
                setIsSelecting(true);
                setSelectionStart({ r, c });
                setCurrentSelection([`${r}-${c}`]);
            };

            const handleMouseEnter = (r, c) => {
                if (isSelecting && selectionStart) {
                    setCurrentSelection(getLineCoords(selectionStart, { r, c }));
                }
            };

            const handleMouseUp = () => {
                setIsSelecting(false);
                
                const selectionStr = currentSelection.join('|');
                const reverseSelectionStr = [...currentSelection].reverse().join('|');

                const matchedWord = gridData.placedWords.find(pw => {
                    const wordPathStr = pw.coordinates.join('|');
                    return (wordPathStr === selectionStr || wordPathStr === reverseSelectionStr) && !foundWords.includes(pw.word);
                });

                if (matchedWord) {
                    setFoundWords([...foundWords, matchedWord.word]);
                    const newFoundCoords = new Set(foundCoordinates);
                    matchedWord.coordinates.forEach(coord => newFoundCoords.add(coord));
                    setFoundCoordinates(newFoundCoords);
                    speakWord(matchedWord.word);
                }
                
                setCurrentSelection([]);
            };

            const checkGrammar = () => {
                let errors = [];
                const cleanStory = story.toLowerCase().replace(/[.,!?]/g, '');
                const usedWords = WORD_LIST.filter(w => {
                    const cleanW = w.toLowerCase().replace(/[.,!?]/g, '');
                    return cleanStory.includes(cleanW);
                });
                
                if (usedWords.length < 8) {
                    errors.push(`You have only used ${usedWords.length}/8 required words.`);
                }
                if (story.length > 0 && story[0] !== story[0].toUpperCase()) {
                    errors.push("Sentence must start with a capital letter.");
                }
                if (!story.endsWith('.') && !story.endsWith('!') && !story.endsWith('?')) {
                    errors.push("Missing punctuation at the end of the paragraph.");
                }

                const score = Math.max(0, 100 - (errors.length * 10));
                setGrammarScore(score);
                
                if (errors.length > 0) {
                    setGrammarFeedback("Errors to fix immediately: " + errors.join(" "));
                } else {
                    setGrammarFeedback("Perfect! 100% Grammatical Accuracy.");
                    const logs = JSON.parse(localStorage.getItem('pooh_logs') || '[]');
                    logs.push({ nickname, score, time: new Date().toLocaleTimeString() });
                    localStorage.setItem('pooh_logs', JSON.stringify(logs));
                }
            };

            const TeacherDashboard = () => {
                const [pwd, setPwd] = useState('');
                const [auth, setAuth] = useState(false);
                const logs = JSON.parse(localStorage.getItem('pooh_logs') || '[]');

                if (!auth) return (
                    <div className="p-10 text-center bg-white max-w-md mx-auto mt-10 rounded-2xl shadow-lg border-4 border-orange-300">
                        <h2 className="text-2xl mb-4 text-red-600 font-bold">👩‍🏫 Teacher Login</h2>
                        <input type="password" value={pwd} onChange={e => setPwd(e.target.value)} className="border-2 border-orange-200 p-2 rounded mb-4 w-full" placeholder="Enter Password" />
                        <button onClick={() => pwd === '123' ? setAuth(true) : alert('Wrong password')} className="pooh-btn w-full py-2">Login</button>
                    </div>
                );

                return (
                    <div className="p-10 bg-white rounded-2xl shadow-lg mt-6 border-4 border-orange-300">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-red-600">Teacher Dashboard</h2>
                            <button onClick={() => alert("Downloading CSV...")} className="bg-green-500 text-white font-bold px-4 py-2 rounded-full hover:bg-green-600">📥 Download CSV</button>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead><tr className="bg-orange-200 text-orange-900"><th className="p-3 border-2 border-orange-300">Student Name</th><th className="p-3 border-2 border-orange-300">Grammar Score</th><th className="p-3 border-2 border-orange-300">Submission Time</th></tr></thead>
                                <tbody>
                                    {logs.length === 0 ? <tr><td colSpan="3" className="p-4 text-center">No submissions yet!</td></tr> : 
                                    logs.map((log, i) => <tr key={i} className="hover:bg-orange-50"><td className="p-3 border-2 border-orange-200">{log.nickname}</td><td className="p-3 border-2 border-orange-200">{log.score}%</td><td className="p-3 border-2 border-orange-200">{log.time}</td></tr>)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            if (!hasStarted) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen">
                        <div className="bg-white p-12 rounded-3xl shadow-2xl border-8 border-orange-300 max-w-2xl text-center relative overflow-hidden">
                            <div className="text-6xl mb-4">🐻🍯🐝</div>
                            <h1 className="text-4xl md:text-5xl font-bold mb-4 text-red-600 leading-tight">
                                Naomi's English Funland presents:<br/>
                                <span className="text-orange-500">Winnie the Pooh's Word Adventure</span>
                            </h1>
                            <p className="mb-8 text-xl text-orange-800">Find the hidden words and write a perfect story!</p>
                            
                            <div className="space-y-6 max-w-sm mx-auto">
                                <input 
                                    type="text" 
                                    placeholder="Enter your nickname" 
                                    className="w-full p-4 text-xl border-4 border-yellow-400 rounded-xl text-center focus:outline-none focus:border-red-400" 
                                    value={nickname} 
                                    onChange={e => setNickname(e.target.value)} 
                                    onKeyDown={e => e.key === 'Enter' && nickname && setHasStarted(true)}
                                />
                                <button 
                                    onClick={() => nickname ? setHasStarted(true) : alert('Please enter a nickname to begin your adventure!')} 
                                    className="pooh-btn w-full py-4 text-2xl"
                                >
                                    Start Game!
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 max-w-7xl mx-auto">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-md border-4 border-orange-300">
                        <div className="flex items-center gap-3 mb-4 md:mb-0">
                            <span className="text-3xl">🐻</span>
                            <h1 className="text-xl md:text-2xl font-bold text-red-600">Winnie the Pooh's Word Adventure</h1>
                        </div>
                        <div className="flex flex-wrap gap-2 justify-center">
                            <button onClick={() => setView('game')} className={`pooh-btn px-4 py-2 ${view === 'game' ? 'bg-orange-400' : ''}`}>🍯 Game</button>
                            <button onClick={() => setView('hall')} className={`pooh-btn px-4 py-2 ${view === 'hall' ? 'bg-orange-400' : ''}`}>🏆 Hall of Fame</button>
                            <button onClick={() => setView('teacher')} className={`pooh-btn px-4 py-2 ${view === 'teacher' ? 'bg-orange-400' : ''}`}>👩‍🏫 Teacher</button>
                        </div>
                    </div>

                    <div style={{ display: view === 'game' ? 'block' : 'none' }}>
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            
                            <div className="lg:col-span-2 bg-white p-6 rounded-3xl shadow-lg border-4 border-yellow-400 overflow-x-auto">
                                <h2 className="text-3xl font-bold mb-4 text-center text-orange-700">🐝 Hundred Acre Wood Word Hunt</h2>
                                <p className="text-center mb-4 text-orange-600">Click and drag to find the words!</p>
                                
                                <div className="grid-container" style={{ gridTemplateColumns: `repeat(30, 1fr)` }}>
                                    {gridData.grid.map((row, rIdx) => 
                                        row.map((cell, cIdx) => {
                                            const coord = `${rIdx}-${cIdx}`;
                                            const isFound = foundCoordinates.has(coord);
                                            const isSelected = currentSelection.includes(coord);
                                            
                                            let className = "grid-cell";
                                            if (isFound) className += " found";
                                            else if (isSelected) className += " selected";

                                            return (
                                                <div 
                                                    key={coord} 
                                                    className={className}
                                                    onMouseDown={(e) => { e.preventDefault(); handleMouseDown(rIdx, cIdx); }}
                                                    onMouseEnter={() => handleMouseEnter(rIdx, cIdx)}
                                                >
                                                    {cell}
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-3xl shadow-lg border-4 border-orange-300">
                                    <h2 className="text-2xl font-bold mb-4 text-orange-800">🦉 Owl's Wisdom</h2>
                                    <p className="text-sm mb-3 text-gray-600">Words found: {foundWords.length} / {WORD_LIST.length}</p>
                                    <div className="flex flex-wrap gap-2 max-h-64 overflow-y-auto p-2">
                                        {WORD_LIST.map(word => (
                                            <span 
                                                key={word} 
                                                className={`px-2 py-1 text-sm rounded-full font-bold border-2 ${foundWords.includes(word) ? 'bg-green-200 border-green-400 text-green-800 line-through' : 'bg-yellow-100 border-yellow-300 text-yellow-800'}`}
                                            >
                                                {word}
                                            </span>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-3xl shadow-lg border-4 border-orange-300">
                                    <h2 className="text-2xl font-bold mb-2 text-orange-800">👦 Christopher Robin's Challenge</h2>
                                    <p className="text-sm mb-4 text-gray-700">Write a story using at least <strong>8 vocabulary words</strong>. Score 100% to pass!</p>
                                    <textarea 
                                        value={story} 
                                        onChange={e => setStory(e.target.value)} 
                                        className="w-full h-40 p-4 border-2 border-orange-200 rounded-xl mb-4 focus:outline-none focus:border-orange-500 resize-none" 
                                        placeholder="Once upon a time in the Hundred Acre Wood..."
                                    ></textarea>
                                    <button onClick={checkGrammar} className="pooh-btn w-full py-3 text-xl">Check Story!</button>
                                    
                                    {grammarFeedback && (
                                        <div className={`mt-4 p-4 rounded-xl border-2 ${grammarScore === 100 ? 'bg-green-100 border-green-400 text-green-800' : 'bg-red-100 border-red-400 text-red-800'}`}>
                                            <p className="font-bold text-lg mb-1">Score: {grammarScore}%</p>
                                            <p>{grammarFeedback}</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div style={{ display: view === 'hall' ? 'block' : 'none' }}>
                        <div className="bg-white p-10 rounded-3xl shadow-lg text-center max-w-3xl mx-auto border-4 border-yellow-400 mt-6">
                            <h2 className="text-5xl font-bold mb-8 text-yellow-600">🏆 Global Hall of Fame</h2>
                            <p className="mb-8 text-xl text-orange-800">Current Explorer: <span className="font-bold text-red-600">{nickname}</span></p>
                            
                            <div className="bg-yellow-50 p-6 rounded-2xl border-2 border-orange-200">
                                {JSON.parse(localStorage.getItem('pooh_logs') || '[]').length === 0 ? (
                                    <p className="text-gray-500 italic">No scores submitted yet. Be the first!</p>
                                ) : (
                                    <div className="space-y-3">
                                        {JSON.parse(localStorage.getItem('pooh_logs') || '[]')
                                            .sort((a, b) => b.score - a.score)
                                            .map((log, i) => (
                                            <div key={i} className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-orange-100">
                                                <span className="font-bold text-lg text-orange-900">#{i + 1} {log.nickname}</span>
                                                <span className="bg-green-100 text-green-800 px-3 py-1 rounded-full font-bold">{log.score}% Accuracy</span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div style={{ display: view === 'teacher' ? 'block' : 'none' }}>
                        <TeacherDashboard />
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
